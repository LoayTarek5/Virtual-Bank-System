services:
  postgres:
    image: postgres:16-alpine
    container_name: vbank-postgres
    environment:
      POSTGRES_USER: vbank
      POSTGRES_PASSWORD: vbank
    ports:
      - "5432:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vbank"]
      interval: 5s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    container_name: vbank-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.2
    container_name: vbank-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  user-service:
    build:
      context: .
      args:
        SERVICE: user-service
    container_name: vbank-user-service
    ports:
      - "8081:8081"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/vbank_users
      - KAFKA_URL=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  account-service:
    build:
      context: .
      args:
        SERVICE: account-service
    container_name: vbank-account-service
    ports:
      - "8082:8082"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/vbank_accounts
      - KAFKA_URL=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  transaction-service:
    build:
      context: .
      args:
        SERVICE: transaction-service
    container_name: vbank-transaction-service
    ports:
      - "8083:8083"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/vbank_transactions
      - KAFKA_URL=kafka:9092
      - ACCOUNT_SERVICE_URL=http://account-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      account-service:
        condition: service_started

  bff-service:
    build:
      context: .
      args:
        SERVICE: bff-service
    container_name: vbank-bff-service
    ports:
      - "8084:8084"
    environment:
      - KAFKA_URL=kafka:9092
      - USER_SERVICE_URL=http://user-service:8081
      - ACCOUNT_SERVICE_URL=http://account-service:8082
      - TRANSACTION_SERVICE_URL=http://transaction-service:8083
    depends_on:
      kafka:
        condition: service_started
      user-service:
        condition: service_started
      account-service:
        condition: service_started
      transaction-service:
        condition: service_started

  logging-service:
    build:
      context: .
      args:
        SERVICE: logging-service
    container_name: vbank-logging-service
    ports:
      - "8085:8085"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/vbank_logs
      - KAFKA_URL=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  wso2am:
    image: wso2/wso2am:4.3.0
    container_name: vbank-wso2am
    ports:
      - "8280:8280"
      - "8243:8243"
      - "9443:9443"
    environment:
      - JVM_MEM_OPTS=-Xmx1536m -Xms1536m
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: