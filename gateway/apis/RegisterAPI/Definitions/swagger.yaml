components:
  schemas:
    RegisterRequest:
      properties:
        email:
          example: john.doe@example.com
          format: email
          type: string
        firstName:
          example: John
          type: string
        lastName:
          example: Doe
          type: string
        password:
          example: securePassword123
          format: password
          type: string
        username:
          example: john.doe
          type: string
      required:
      - username
      - password
      - email
      - firstName
      - lastName
      type: object
    RegisterResponse:
      properties:
        message:
          type: string
        userId:
          format: uuid
          type: string
        username:
          type: string
      type: object
info:
  description: User registration for the vbank system.
  title: RegisterAPI
  version: 1.0.0
openapi: 3.0.3
paths:
  /users/register:
    post:
      operationId: registerUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: User registered successfully
        "400":
          description: Validation error
        "409":
          description: Username or email already exists
      summary: Register a new user
