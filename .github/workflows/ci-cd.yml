name: CI-CD-Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test all modules
        run: ./mvnw clean verify

      - name: Upload service jars
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: '*/target/*.jar'
          retention-days: 1

  docker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ user-service, account-service, transaction-service, bff-service, logging-service ]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download service jars
        uses: actions/download-artifact@v4
        with:
          name: jars

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/vbank-${{ matrix.service }}
          docker build --build-arg SERVICE=${{ matrix.service }} \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest